name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to validate and release
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Validate, publish and release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate release tag and event ref
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]]; then
            echo "Workflow ref $GITHUB_REF must match release tag $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Check out API source
        uses: actions/checkout@v4
        with:
          repository: ZoniBoy00/gzw-data
          path: .integration/gzw-data

      - name: Check out scraper source
        uses: actions/checkout@v4
        with:
          repository: ZoniBoy00/gzw-scraper
          path: .integration/gzw-scraper

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Set up npm for trusted publishing
        run: |
          npm install --global npm@11.5.1
          node --version
          npm --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null
          tag_version="${RELEASE_TAG#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag v$tag_version does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Run package checks
        run: npm run check

      - name: Verify generated output
        run: npm run check:generated

      - name: Verify API contract
        run: npm run contract:check

      - name: Run live contract check
        run: npm run contract:live

      - name: Verify API repository
        run: |
          npm test --prefix .integration/gzw-data
          npm run validate:data --prefix .integration/gzw-data

      - name: Install scraper test dependencies
        run: python -m pip install pytest requests beautifulsoup4 lxml tqdm

      - name: Verify scraper repository
        working-directory: .integration/gzw-scraper
        run: python -m pytest -q

      - name: Verify cross-repository and live SDK contracts
        env:
          GZW_DATA_REPO: .integration/gzw-data
          GZW_SCRAPER_REPO: .integration/gzw-scraper
        run: npm run integration:check

      - name: Inspect package
        run: npm pack --dry-run

      - name: Smoke test packed package
        run: npm run tarball:smoke

      - name: Check registry publication state
        id: registry
        shell: bash
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="${RELEASE_TAG#v}"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package with provenance
        if: steps.registry.outputs.already_published != 'true'
        run: npm publish --provenance --access public

      - name: Smoke test published package
        run: npm run published:smoke -- "${RELEASE_TAG#v}"

      - name: Create GitHub release
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi

      - name: Mark generated-metadata release published
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -c release-roadmap-update origin/main
          node scripts/release-docs.mjs published "${RELEASE_TAG#v}"
          if ! git diff --quiet -- ROADMAP.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ROADMAP.md
            git commit -m "docs: mark ${RELEASE_TAG#v} release verified" \
              -m "$(printf '%s\n' '- update the current published version and release status' '- record the verified package provenance and smoke test')"
            git push origin HEAD:main
          fi
