name: Refresh generated types

# Weekly check of the autocomplete snapshot (src/generated/datasets.ts).
# Record counts change with every scraper run and are ignored; only new or removed datasets,
# fields or field types open a pull request. Publishing to npm stays a manual decision.
on:
  schedule:
    - cron: '47 9 * * 2' # Tuesday, after the weekly scraper run and the compatibility check
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-generated-types
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the autocomplete snapshot when the API structure changed
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: chore/refresh-generated-types
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Regenerate when the structure changed
        run: npm run generate-types:if-changed

      - name: Stop when nothing changed
        id: diff
        run: |
          if git diff --quiet -- src/generated/datasets.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The snapshot is current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pull requests opened with GITHUB_TOKEN do not start other workflows,
      # so run the full SDK check here and open the PR only if it passes.
      - name: Build, type-check and test with the new snapshot
        if: steps.diff.outputs.changed == 'true'
        run: npm run check

      - name: Open or update the pull request
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add src/generated/datasets.ts
          git commit -m "chore(types): refresh generated dataset snapshot" -m "The live API metadata added, removed or changed datasets, fields or field types. Autocomplete only; runtime dataset discovery is unaffected. Release to npm when you want these suggestions published."
          git push --force origin "$BRANCH"
          body="The live API metadata changed (datasets, fields or field types). Generated by the weekly refresh workflow after npm run check passed. Only editor autocomplete changes: runtime dataset discovery already sees new data, so there is no need to publish to npm for every refresh. Merge when convenient and release in a batch."
          if [ -z "$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "chore(types): refresh generated dataset snapshot" --body "$body"
          fi
