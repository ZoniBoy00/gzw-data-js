name: Bug report
description: Report a reproducible issue in the JavaScript/TypeScript client.
title: "bug: "
body:
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: "@zoniboy/gzw-data-client 0.7.2"
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: "Node.js 22, Chrome 140, etc."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include the smallest code sample or steps that reproduce the issue. Remove secrets and private data.
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
